# Caller workflow for "PROD/crm-deployment" — generated by CF Migrate.
# Calls the shared template as a reusable workflow; only variable values differ per instance.
name: crm-deployment

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  call-template:
    uses: ./BILLING_billing-deployment.suggested.yml
    with:
      ECR_REPO: "123456789.dkr.ecr.us-east-1.amazonaws.com/crm-app"
      HELM_RELEASE_NAME: "crm"
      repo: "myorg/crm-app"
      image_name: "crm-app"
      deploy_to_staging_chart_name: "charts/crm-app"
      deploy_to_staging_release_name: "crm-staging"
      deploy_to_staging_replicaCount: "2"
      deploy_to_production_chart_name: "charts/crm-app"
      deploy_to_production_release_name: "crm-production"
      deploy_to_production_replicaCount: "5"
    secrets: inherit
